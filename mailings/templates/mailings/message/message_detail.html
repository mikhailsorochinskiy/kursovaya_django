{% extends 'mailings/base.html' %}

{% block title %}Сообщение{% endblock %}

{% block content %}
<div class="container mt-5">
  <h1>"{{ message.message_topic}}"</h1>
  <li class="list-group-item">{{ message.message_text }}</li>
  <a href="{% url 'mailings:message_update' message.pk %}" class="btn btn-secondary">Изменить</a>
  <a href="{% url 'mailings:message_delete' message.pk %}" class="btn btn-danger">Удалить</a>
</div>
{% endblock %}
