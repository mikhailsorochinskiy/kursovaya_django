{% extends 'mailings/base.html' %}

{% block title %}Удалить сообщение{% endblock %}

{% block content %}
<h2>Удалить сообщение?</h2>
<p>Вы уверены, что хотите удалить "{{ message.message_topic }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'mailings:messages_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
