{% extends 'mailings/base.html' %}

{% block title %}Создание получателя{% endblock %}

{% block content %}
<div class="container mt-5">
  <h1>Создание получателя</h1>
  <form method="post" enctype='multipart/form-data'>
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'mailings:mailing_recipients_list' %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
