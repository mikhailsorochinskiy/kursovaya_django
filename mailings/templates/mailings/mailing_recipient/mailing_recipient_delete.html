{% extends 'mailings/base.html' %}

{% block title %}Удалить получателя{% endblock %}

{% block content %}
<h2>Удалить получателя?</h2>
<p>Вы уверены, что хотите удалить "{{ mailing_recipient.email }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'mailings:mailing_recipients_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
