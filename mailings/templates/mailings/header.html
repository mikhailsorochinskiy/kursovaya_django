<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Сервис рассылок</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailings:home' %}">Главная</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailings:mailings_list' %}">Рассылки</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailings:messages_list' %}">Сообщения</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailings:mailing_recipients_list' %}">Получатели</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailings:try_mailings' %}">Попытки рассылок</a>
        {% if user.is_authenticated %}
        <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-primary">Выйти</button>
        </form>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:user_detail' user.pk %}">Мой профиль</a>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Войти</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:registration' %}">Регистрация</a>
        {% endif %}
        {% if perms.mailings.can_view_mailing %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:users' %}">Пользователи</a>
        {% endif %}
    </nav>
</div>
