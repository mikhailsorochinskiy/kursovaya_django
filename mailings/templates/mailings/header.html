<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Сервис рассылок</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="#">Главная</a>
        <a class="p-2 btn btn-outline-primary" href="#">Создать получателя</a>
        <a class="p-2 btn btn-outline-primary" href="#">Контакты</a>
        {% if user.is_authenticated %}
        <form method="post" action="#" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-primary">Выйти</button>
        </form>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="#">Войти</a>
        <a class="p-2 btn btn-outline-primary" href="#">Регистрация</a>
        {% endif %}
    </nav>
</div>
